# FinTech Growth & Revenue Funnel — local PostgreSQL environment
services:
  postgres:
    image: postgres:15
    container_name: fintech_growth_db
    environment:
      POSTGRES_DB: fintech_growth
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - fintech_pg_data:/var/lib/postgresql/data
      # Auto-apply schema on first container start
      - ./sql/01_schema_definition.sql:/docker-entrypoint-initdb.d/01_schema_definition.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d fintech_growth"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  fintech_pg_data:
    driver: local
